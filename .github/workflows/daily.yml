name: daily-drill

on:
  schedule:
    - cron: "50 6 * * *" # 09:50 по московскому времени (UTC+3); бот работает до ~15:10
  workflow_dispatch: # ручной запуск для теста

concurrency:
  group: drill-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # база хранится в репозитории зашифрованной (bot.db.enc); ключ — в секретах
      - name: Decrypt database
        env:
          DB_ENCRYPT_KEY: ${{ secrets.DB_ENCRYPT_KEY }}
        run: |
          if [ -f bot.db.enc ] && [ -n "$DB_ENCRYPT_KEY" ]; then
            python - <<'EOF'
            import os
            from cryptography.fernet import Fernet
            key = os.environ["DB_ENCRYPT_KEY"].strip().encode()
            open("bot.db", "wb").write(Fernet(key).decrypt(open("bot.db.enc", "rb").read()))
            EOF
            echo "database decrypted"
          fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TIMEZONE: Europe/Moscow
          MAX_RUN_MINUTES: "320"
        run: python bot.py

      # шифруем базу и коммитим только шифрованный блоб — открытые данные не публикуются
      - name: Save stats database (encrypted)
        if: always()
        env:
          DB_ENCRYPT_KEY: ${{ secrets.DB_ENCRYPT_KEY }}
        run: |
          if [ -f bot.db ] && [ -n "$DB_ENCRYPT_KEY" ]; then
            python - <<'EOF'
            import os, sqlite3
            from cryptography.fernet import Fernet
            c = sqlite3.connect("bot.db")
            c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
            c.close()
            key = os.environ["DB_ENCRYPT_KEY"].strip().encode()
            data = open("bot.db", "rb").read()
            open("bot.db.enc", "wb").write(Fernet(key).encrypt(data))
            EOF
            rm -f bot.db bot.db-wal bot.db-shm
            git config user.name "drill-bot-db"
            git config user.email "actions@users.noreply.github.com"
            git rm --cached bot.db -q 2>/dev/null || true
            git add bot.db.enc
            git commit -m "chore(db): daily stats update (encrypted) [skip ci]" || echo "nothing to commit"
            git push || echo "push failed"
          fi
